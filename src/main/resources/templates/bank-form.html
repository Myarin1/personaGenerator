<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générer IBAN/BIC</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💳 Générer IBAN/BIC</h2>
        <form th:action="@{|/generate-bank/${persona.id}|}" th:object="${bankForm}" method="post">
            <div class="form-group">
                <label for="bank">Banque :</label>
                <select id="bank" th:field="*{bank}">
                    <option th:each="b : ${banks}" th:value="${b}" th:text="${b}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="agency">Agence :</label>
                <select id="agency" th:field="*{agency}">
                    <option th:each="a : ${agencies}" th:value="${a}" th:text="${a}"></option>
                </select>
            </div>
            <button type="submit">Générer IBAN/BIC</button>
        </form>
        <a href="/" class="back-link">← Retour à la liste</a>
    </div>
</body>
</html>
